# Posts a cell-by-cell diff of changed Excel workbooks on every pull request.
# This repository uses its own action from the checkout; other repositories
# get this file from `xlgit install --github`, which uses the published one.
name: Excel diff

on:
  pull_request:
    paths: ["**/*.xlsx", "**/*.xlsm", "**/*.XLSX", "**/*.XLSM"]

permissions:
  contents: read
  pull-requests: write

jobs:
  excel-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
